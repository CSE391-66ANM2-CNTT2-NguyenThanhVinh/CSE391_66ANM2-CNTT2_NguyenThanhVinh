<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 1</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
        }

        .form-container {
            border: 1px solid #333;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-title {
            color: #555;
            font-size: 19px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 2px;
            outline: none;
            color: #333;
            font-size: 14px;
            display: block;
        }

        .row-flex {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn-submit {
            background-color: #80c8ff;
            color: white;
            border: 1px solid #6cb4eb;
            padding: 10px 20px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 15px;
        }

        .note-text {
            color: #888;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h3 class="form-title">Get in touch with us by filling contact form below</h3>
        
        <form>
            <div class="row-flex">
                <input type="text" class="form-input" placeholder="* Enter your full name">
                <input type="email" class="form-input" placeholder="* Enter your email address">
            </div>

            <div class="form-group">
                <input type="text" class="form-input" placeholder="Enter your subject">
            </div>

            <div class="form-group">
                <textarea class="form-input" placeholder="* Your message here..."></textarea>
            </div>

            <div class="form-footer">
                <button type="button" class="btn-submit">Send message</button>
                <span class="note-text">* Please fill all required form field, thanks!</span>
            </div>
        </form>
    </div>

</body>
</html>
