<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng ký nhiều bước</title>
    <style>
        body { max-width: 500px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        h1 { background-color: rgb(182, 195, 206); text-align: center; padding: 10px; }

        .progress-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .progress-bar { flex: 1; height: 8px; background: #ddd; border-radius: 4px; }
        .progress-fill { height: 100%; background: rgb(25, 119, 233); border-radius: 4px; transition: width 0.3s; }
        .progress-label { font-size: 13px; color: #555; white-space: nowrap; }

        .step { display: none; }
        .step.active { display: block; }

        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        input.error { border-color: red; }
        input.valid { border-color: green; }
        input[type="radio"] { width: auto; }
        .error-msg { color: red; font-size: 13px; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px; background-color: rgb(25, 119, 233); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
        #btnBack { background-color: gray; }

        .confirm-info p { margin: 6px 0; }

        #successMsg { display: none; text-align: center; color: green; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Đăng ký tài khoản</h1>

    <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-label" id="progressLabel">Bước 1/3</span>
    </div>

    <div class="step active" id="step1">
        <h3>Bước 1 — Thông tin cá nhân</h3>
        <div class="field">
            <label>Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nguyễn Văn A">
            <span class="error-msg" id="fullname-error"></span>
        </div>
        <div class="field">
            <label>Ngày sinh</label>
            <input type="date" id="dob">
            <span class="error-msg" id="dob-error"></span>
        </div>
        <div class="field">
            <label>Giới tính</label>
            <label><input type="radio" name="gender" value="Nam"> Nam</label>
            <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
            <label><input type="radio" name="gender" value="Khác"> Khác</label>
            <span class="error-msg" id="gender-error"></span>
        </div>
        <div class="btn-group">
            <button onclick="nextStep(1)">Tiếp theo →</button>
        </div>
    </div>

    <div class="step" id="step2">
        <h3>Bước 2 — Thông tin tài khoản</h3>
        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="example@gmail.com">
            <span class="error-msg" id="email-error"></span>
        </div>
        <div class="field">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Tối thiểu 8 ký tự">
            <span class="error-msg" id="password-error"></span>
        </div>
        <div class="field">
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
            <span class="error-msg" id="confirmPassword-error"></span>
        </div>
        <div class="btn-group">
            <button id="btnBack" onclick="prevStep(2)">← Quay lại</button>
            <button onclick="nextStep(2)">Tiếp theo →</button>
        </div>
    </div>

    <div class="step" id="step3">
        <h3>Bước 3 — Xác nhận thông tin</h3>
        <div class="confirm-info" id="confirmInfo"></div>
        <div class="btn-group">
            <button id="btnBack" onclick="prevStep(3)">← Quay lại</button>
            <button onclick="submitForm()">✅ Xác nhận đăng ký</button>
        </div>
    </div>

    <div id="successMsg"></div>

    <script>
        let currentStep = 1;
        const totalSteps = 3;

        function updateProgress() {
            document.getElementById('progressFill').style.width = (currentStep / totalSteps * 100) + '%';
            document.getElementById('progressLabel').textContent = `Bước ${currentStep}/${totalSteps}`;
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            currentStep = n;
            updateProgress();
        }

        function showError(id, msg) {
            document.getElementById(id + '-error').textContent = msg;
            const el = document.getElementById(id);
            if (el) { el.classList.add('error'); el.classList.remove('valid'); }
        }
        function clearError(id) {
            document.getElementById(id + '-error').textContent = '';
            const el = document.getElementById(id);
            if (el) { el.classList.remove('error'); el.classList.add('valid'); }
        }

        function validateStep1() {
            let ok = true;

            const name = document.getElementById('fullname').value.trim();
            if (!name || name.length < 3) { showError('fullname', 'Họ tên ít nhất 3 ký tự.'); ok = false; }
            else clearError('fullname');

            const dob = document.getElementById('dob').value;
            if (!dob) { showError('dob', 'Vui lòng chọn ngày sinh.'); ok = false; }
            else clearError('dob');

            if (!document.querySelector('input[name="gender"]:checked')) {
                showError('gender', 'Vui lòng chọn giới tính.'); ok = false;
            } else clearError('gender');

            return ok;
        }

        function validateStep2() {
            let ok = true;

            const email = document.getElementById('email').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('email', 'Email không hợp lệ.'); ok = false; }
            else clearError('email');

            const pw = document.getElementById('password').value;
            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(pw)) {
                showError('password', 'Mật khẩu ≥ 8 ký tự, có chữ hoa, chữ thường, số.'); ok = false;
            } else clearError('password');

            const cpw = document.getElementById('confirmPassword').value;
            if (pw !== cpw) { showError('confirmPassword', 'Mật khẩu không khớp.'); ok = false; }
            else clearError('confirmPassword');

            return ok;
        }

        function nextStep(from) {
            if (from === 1 && !validateStep1()) return;
            if (from === 2 && !validateStep2()) return;
            if (from === 2) fillConfirm();
            showStep(from + 1);
        }

        function prevStep(from) {
            showStep(from - 1);
        }

        function fillConfirm() {
            const gender = document.querySelector('input[name="gender"]:checked').value;
            document.getElementById('confirmInfo').innerHTML = `
                <p>👤 Họ tên: <strong>${document.getElementById('fullname').value.trim()}</strong></p>
                <p>🎂 Ngày sinh: <strong>${document.getElementById('dob').value}</strong></p>
                <p>⚧ Giới tính: <strong>${gender}</strong></p>
                <p>📧 Email: <strong>${document.getElementById('email').value.trim()}</strong></p>
                <p>🔒 Mật khẩu: <strong>••••••••</strong></p>
            `;
        }

        function submitForm() {
            document.querySelectorAll('.step').forEach(s => s.style.display = 'none');
            document.querySelector('.progress-wrap').style.display = 'none';
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            msg.innerHTML = `Đăng ký thành công! 🎉<br>Xin chào, <strong>${document.getElementById('fullname').value.trim()}</strong>!`;
        }

        updateProgress();
    </script>
</body>
</html>
